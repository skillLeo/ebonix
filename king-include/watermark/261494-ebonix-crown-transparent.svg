<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
  <defs>
    <!-- background is transparent by default -->
    <linearGradient id="ebonixGrad" gradientUnits="userSpaceOnUse" x1="0" y1="500" x2="1400" y2="0">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#C8FF00"/>
    </linearGradient>
  </defs>

  <!-- Crown (3-point geometric) hovering above the E; width ~ matches E width -->
  <g transform="translate(195,70)">
    <!-- Crown shape -->
    <path fill="url(#ebonixGrad)" d="
      M 0 165
      L 0 55
      L 70 95
      L 150 0
      L 230 95
      L 300 55
      L 300 165
      L 0 165
      Z" />
    <!-- Crown base -->
    <path fill="url(#ebonixGrad)" d="
      M 20 165
      L 280 165
      L 260 210
      L 40 210
      Z" />
  </g>

  <!-- Wordmark -->
  <!-- Note: font renders as Astronova if installed; otherwise falls back. -->
  <text x="170" y="360"
        font-family="Astronova, system-ui, -apple-system, Segoe UI, Inter, Arial, sans-serif"
        font-size="230"
        font-weight="700"
        letter-spacing="1"
        fill="url(#ebonixGrad)">Ebonix</text>
</svg>
